# Publica o site no GitHub Pages a cada envio para a branch main,
# inclusive quando uma música é enviada pelo navegador do celular.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: Gerar a lista do acervo
        run: python3 tools/gerar_acervo.py

      - name: Montar o site
        run: |
          mkdir _site
          cp -r *.html sw.js manifest.webmanifest icones musicas docs _site/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v5
