<text class="val" x="576" y="538">100 kΩ</text>
<text class="ref" x="454" y="598">PR_REF</text>
<text class="val" x="454" y="614">10 kΩ</text>
<text class="net" x="600" y="572">VREF</text>

<line x1="560" y1="576" x2="680" y2="576" class="w"/>
<line x1="680" y1="576" x2="680" y2="600" class="w"/>
<line x1="664" y1="600" x2="696" y2="600" class="c"/>
<line x1="664" y1="610" x2="696" y2="610" class="c"/>
<line x1="680" y1="610" x2="680" y2="650" class="w"/>
<line x1="662" y1="650" x2="698" y2="650" class="w"/>
<line x1="669" y1="657" x2="691" y2="657" class="w"/>
<line x1="676" y1="664" x2="684" y2="664" class="w"/>
<text class="net" x="652" y="682">HVGD</text>
<text class="ref" x="704" y="598">C_R</text>
<text class="val" x="704" y="614">100 nF</text>

<text class="note" x="420" y="506">VREF define o limite. Com R_SH</text>
<text class="note" x="420" y="520">de 0,05 Ω, 1,0 V ≈ 20 A de pico.</text>

