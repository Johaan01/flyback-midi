<text class="ref" x="826" y="284">R_ISO</text>
<text class="val" x="826" y="300">1 kΩ</text>

<line x1="760" y1="310" x2="760" y2="375" class="w"/>
<line x1="760" y1="375" x2="880" y2="375" class="w"/>

<!-- ============ 6N136 ============ -->
<rect x="880" y="290" width="140" height="140" class="c"/>
<text class="ref" x="880" y="284">U_ISO2</text>
