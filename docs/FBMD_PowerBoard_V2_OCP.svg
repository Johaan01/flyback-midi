<line x1="288" y1="350" x2="460" y2="350" class="w"/>
<text class="ref" x="242" y="335">R_B</text>
<text class="val" x="242" y="378">1 kΩ</text>

<circle cx="330" cy="350" r="3.5" class="dot"/>
<line x1="330" y1="350" x2="330" y2="386" class="w"/>
