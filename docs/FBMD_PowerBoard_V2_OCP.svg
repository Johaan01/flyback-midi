<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 700" width="1280" height="700" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect x="0" y="0" width="1280" height="700" fill="#FDFCF8"/>

<style>
.w { stroke:#333; stroke-width:1.6; fill:none; }
.c { stroke:#8B1A1A; stroke-width:1.8; fill:none; }
.cf { fill:#8B1A1A; }
.ref { fill:#8B1A1A; font-size:12px; font-weight:bold; }
.val { fill:#1A4A8B; font-size:12px; }
.net { fill:#1A4A8B; font-size:13px; font-weight:bold; }
.pin { fill:#555; font-size:10px; }
.note { fill:#7A5C00; font-size:11px; font-style:italic; }
.ttl { fill:#333; font-size:15px; font-weight:bold; }
.sec { fill:#999; font-size:12px; font-weight:bold; letter-spacing:1px; }
.dot { fill:#333; }
</style>

<text class="ttl" x="30" y="34">FBMD — PowerBoard V2 · folha 2 · proteção de sobrecorrente ciclo a ciclo</text>
<text class="note" x="30" y="52">A rampa de corrente do primário é comparada contra VREF. Ao cruzar, o LM311 acende o LED do 6N136, que aterra o pino 4 do NE555 e termina o pulso.</text>

<!-- BARREIRA -->
<line x1="950" y1="80" x2="950" y2="660" stroke="#C08A00" stroke-width="1.6" stroke-dasharray="7 5"/>
<text class="note" x="956" y="470" transform="rotate(90 956 470)">barreira de isolação</text>
<text class="sec" x="60" y="96">LADO DE POTÊNCIA</text>
<text class="sec" x="990" y="96">LADO LÓGICO</text>

<!-- ============ SHUNT ============ -->
<text class="net" x="76" y="126">SOURCE Q1</text>
<line x1="120" y1="134" x2="120" y2="170" class="w"/>
<rect x="111" y="170" width="18" height="48" class="c"/>
<line x1="120" y1="218" x2="120" y2="256" class="w"/>
