<line x1="1079" y1="477" x2="1101" y2="477" class="w"/>
<line x1="1086" y1="484" x2="1094" y2="484" class="w"/>
<text class="net" x="1062" y="502">LGND</text>
<text class="ref" x="1106" y="406">R_BS</text>
<text class="val" x="1106" y="422">100 kΩ</text>
<text class="note" x="1064" y="530">base do fototransistor</text>
<text class="note" x="1064" y="544">aterrada — imunidade a ruído</text>

<!-- saida para o 555 -->
<line x1="1020" y1="375" x2="1180" y2="375" class="w"/>
<circle cx="1180" cy="375" r="3.5" class="dot"/>
<text class="net" x="1146" y="240">+12V LÓG</text>
<line x1="1180" y1="248" x2="1180" y2="288" class="w"/>
<rect x="1171" y="288" width="18" height="48" class="c"/>
<line x1="1180" y1="336" x2="1180" y2="375" class="w"/>
<text class="ref" x="1196" y="308">R_PU</text>
<text class="val" x="1196" y="324">10 kΩ</text>
<text class="val" x="1196" y="339">já existe</text>
<line x1="1180" y1="375" x2="1236" y2="375" class="w"/>
<text class="net" x="1146" y="398">→ pino 4 do NE555</text>

<!-- notas -->
<text class="note" x="60" y="560">Polaridade do LM311: o sinal do shunt entra no pino 3 e a referência no pino 2.</text>
<text class="note" x="60" y="576">Assim, quando a corrente ultrapassa VREF, a saída afunda e acende o LED.</text>
<text class="note" x="60" y="600">O 555 fornece a trava: uma vez resetado, só volta no próximo disparo.</text>
<text class="note" x="60" y="616">Não há risco de oscilação em alta frequência.</text>
<text class="note" x="60" y="640">Conferir a faixa de VCC do 6N136 no lote antes de alimentar o lado lógico em 12 V.</text>
</svg>
